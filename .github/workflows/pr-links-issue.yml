name: PR references an issue

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-closing-keyword:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR body contains a closing keyword
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if echo "$PR_BODY" | grep -qiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#[0-9]+'; then
            echo "OK: the PR references an issue."
          else
            echo "This PR does not contain 'Closes #N' (or Fixes/Resolves)."
            echo "Every PR must close an issue, otherwise the board will not update automatically."
            exit 1
          fi
