name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/yumover
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
            node-version: '24'
            cache: 'npm'
            cache-dependency-path: backend/package-lock.json 
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm test
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  deploy:
    needs: [test, worker, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env: 
      REGISTRY: europe-west1-docker.pkg.dev/gen-lang-client-0972210119/yumover
    permissions:
      contents: read
      id-token: write
    steps: 
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/684916234126/locations/global/workloadIdentityPools/github/providers/yumover
          service_account: yumover-deployer@gen-lang-client-0972210119.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
      - run: |
          docker build -t "$REGISTRY/worker:${{ github.sha }}" worker/
          docker push "$REGISTRY/worker:${{ github.sha }}"
          docker build -t "$REGISTRY/gateway:${{ github.sha }}" .
          docker push "$REGISTRY/gateway:${{ github.sha }}"
          gcloud run deploy yumover-worker --region=europe-west1 --image="$REGISTRY/worker:${{ github.sha }}"
          gcloud run deploy yumover-gateway --region=europe-west1 --image="$REGISTRY/gateway:${{ github.sha }}"

